# ── miragen-mcp (base) ──────────────────────────────────────────────────────
# All API keys are passed as plain environment variables.
# Set them in your shell, .env file, or Portainer stack environment vars UI.
# For Docker secrets (docker compose direct deployment), use compose.secrets.yml.
#
# This file alone is not a deployable topology -- it has no ingress. Two
# environments run this service and they need OPPOSITE ingress shapes:
#   - VPS:     alongside NPM, reachable by container-name DNS over a shared
#              `proxy` network. No host port needs publishing.
#   - homelab: NPM lives on a different machine, so it must reach this over a
#              published port on the WireGuard address instead.
# One compose.yml serving both broke the VPS on 2026-07-14: adding the
# homelab's BOUND_IP port binding here meant also dropping `proxy`, and the
# VPS's NPM immediately lost `miragen-mcp:8000` -- 502, because compose
# CANNOT declare `proxy: external: true` unconditionally when one target
# (homelab) has no such network; it hard-fails to deploy there instead.
#
# Deploy with the file for your target layered on top of this one:
#   VPS:     docker compose -f compose.yml -f compose.vps.yml up -d --build
#   homelab: docker compose -f compose.yml -f compose.homelab.yml up -d --build
# In Portainer, set "Compose path" to both files, comma-separated.

services:
  miragen-mcp:
    build:
      context: .
      args:
        # Must match the DOCKER GROUP GID ON THE HOST, or mcpuser lands in a
        # group that does not own /var/run/docker.sock and every docker call
        # fails with "permission denied". Find it with:
        #   getent group docker | cut -d: -f3
        DOCKER_GID: ${DOCKER_GID:?set DOCKER_GID to the host's docker group gid}
    container_name: miragen-mcp
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/miragen:/opt/miragen
    environment:
      MIRAGEN_WORKSPACE: /opt/miragen
      MIRAGEN_BASE_IMAGE: ${MIRAGEN_BASE_IMAGE:-ghcr.io/ieepirzy/miragen:latest}
      MCP_BASE_URL: ${MCP_BASE_URL}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET}
      MCP_AUTO_APPROVE: ${MCP_AUTO_APPROVE:-false}
      MCP_PUBLIC_REGISTRATION: ${MCP_PUBLIC_REGISTRATION:-false}
      MCP_NO_AUTH: ${MCP_NO_AUTH:-false}
      MCP_PATH: ${MCP_PATH:-/mcp}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    networks:
      - miragen-net
    security_opt:
      - no-new-privileges:true

networks:
  # Created by compose if absent, and by the server at runtime
  # (_ensure_agent_network) so spawned agents can always be attached to it.
  miragen-net:
    name: miragen-net
