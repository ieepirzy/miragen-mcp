name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Callable so publish.yml can gate the image on this suite rather than
  # duplicating it — same arrangement as the miragen repo's test.yml.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # conftest.py stubs docker, fastmcp, origo, apscheduler and friends,
      # so only the light runtime deps are needed to run the suite.
      - run: pip install pytest pytest-cov httpx pyyaml pydantic
      # python -m pytest (not bare pytest) so the repo root — where server.py
      # lives — is on sys.path for the test imports.
      - run: |
          python -m pytest tests/ -q \
            --junitxml=reports/junit.xml \
            --cov=server --cov-report=xml:reports/coverage.xml

      - name: Publish the reports the code-health lane consumes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py312
          path: reports/
          retention-days: 7
      # Eval-suite consistency (mcp-builder Phase 4): assert every eval.xml
      # answer still derives from the fixtures and touches only read-only tools.
      # No ANTHROPIC_API_KEY — the paid LLM run (evals/run_evals.py) is manual.
      - run: python evals/check_evals.py

  # Code health, maintainability and authorship telemetry. The collector is a
  # separate package so the measurement definitions live in one place across
  # every repository rather than being copied into each one; what *this*
  # repository measures is declared in `mira-vitals.toml`.
  #
  # `needs: [test]` with `if: always()` on purpose: the snapshot should
  # describe the run that gated the build, including a run whose tests failed
  # -- a failing suite is a code-health observation, not a reason to record
  # nothing.
  code-health:
    name: Code health
    needs: [test]
    if: always()
    # A called reusable workflow's jobs cannot request permissions greater
    # than the calling job's, and exceeding them fails the whole run before
    # any job starts -- `startup_failure`, with no log to read. measure.yml
    # needs `actions: read` to fetch the baseline artifact from the previous
    # default-branch run and `pull-requests: read` for provenance labels.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ieepirzy/mira-vitals/.github/workflows/measure.yml@main
    with:
      # The real dependencies, not the stubs conftest.py installs for the
      # suite: pyright resolves imports against the installed environment, so
      # without these its error count is dominated by reportMissingImports and
      # is not comparable with a run that has them.
      project-install: "-r requirements.txt"
      reports-artifact: test-reports-py312
      tests-python-version: "3.12"
      # Telemetry only for now -- the E402 baseline in server.py may end up in
      # `lint_ignore` rather than being restructured away. See mira-vitals.toml.
      gate: false
    secrets: inherit
