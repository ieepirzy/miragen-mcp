name: Publish Docker image

# compose.yml consumes this image rather than building on the deployment host.
# This workflow is what produces it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Not on pull_request, deliberately: a PR build would either publish
# unreviewed code under the tag the stack follows, or produce an image nobody
# pulls.

concurrency:
  # Two pushes to main in quick succession would otherwise race to tag
  # `latest`, and the loser's digest is the one that sticks.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # test.yml's code-health job calls a reusable workflow of its own, and a
    # called workflow's jobs cannot request permissions greater than the
    # calling job's -- exceeding them fails the run before any job starts,
    # with `startup_failure` and no log. Without this block the job would
    # inherit only the repository's default token grant, so the nested call
    # has to be covered here as well as in test.yml.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: test
    # ubuntu-latest is correct here and would not be in the movingfirm repos:
    # this repository is public, so GitHub's hosted minutes are free and
    # unlimited. The private repos have to use self-hosted runners because the
    # account's included minutes are exhausted and their hosted jobs are simply
    # never assigned a runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this workflow needs. `contents` stays read so a
      # compromised build step cannot push to the repository.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Required by the `cache-from/to: type=gha` below, and its absence is
      # what broke the first publish after #22 merged (run 32575800221):
      #
      #     ##[error]buildx failed with: .../go/build-cache-backends/
      #
      # The default `docker` driver cannot export a GitHub Actions cache;
      # setup-buildx-action switches to the docker-container driver, which can.
      # This job was modelled on the miragen repo's publish.yml, which has no
      # buildx step — but it also has no cache lines, so the omission only
      # became a bug once the cache was added here.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Record build start
        id: build_start
        run: echo "ts=$(date +%s.%N)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best-effort fleet build-telemetry push (image footprint, layer count,
      # build duration) to movingfirm-admin's OTLP /v1/metrics and /v1/logs — see
      # scripts/report_build_telemetry.py's docstring (movingfirm-admin#120).
      # No-ops cleanly while OTEL_EXPORTER_OTLP_ENDPOINT is unset; never fails this
      # job either way.
      - name: Report build telemetry
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_STARTED_AT: ${{ steps.build_start.outputs.ts }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_NAME: publish
        run: python3 scripts/report_build_telemetry.py
