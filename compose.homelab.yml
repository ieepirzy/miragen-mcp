# ── miragen-mcp: homelab overlay ─────────────────────────────────────────────
# For the homelab, where NPM runs on a different machine (the VPS) and reaches
# this over WireGuard by IP, not by container-name DNS. Publish the port on
# loopback plus BOUND_IP -- never 0.0.0.0. Point BOUND_IP at the host's
# WireGuard address so the port is reachable inside the mesh (and to the
# remote reverse proxy forwarding to it) but not from the LAN or WAN.
#
# docker compose -f compose.yml -f compose.homelab.yml up -d --build

services:
  miragen-mcp:
    ports:
      - "127.0.0.1:${PORT:-6967}:8000"
      - "${BOUND_IP:?set BOUND_IP to the host's WireGuard address}:${PORT:-6967}:8000"
