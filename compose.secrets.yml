# ── Docker secrets override ───────────────────────────────────────────────────
# Layers Docker secrets on top of compose.yml for direct docker compose deploys.
# Usage: docker compose -f compose.yml -f compose.secrets.yml up -d
#
# The secrets attach to miragend, not miragen-mcp: since the lifecycle
# extraction the daemon is what writes API keys into created agents' compose
# entries — the MCP adapter never sees a model key at all.
#
# Create host key files before deploying:
#   echo "sk-..." > ./secrets/anthropic_key.txt
#   chmod 600 ./secrets/*.txt

secrets:
  anthropic_key:
    file: ./secrets/anthropic_key.txt
  openai_key:
    file: ./secrets/openai_key.txt
  deepseek_key:
    file: ./secrets/deepseek_key.txt
  gemini_key:
    file: ./secrets/gemini_key.txt
  xai_key:
    file: ./secrets/xai_key.txt
  mistral_key:
    file: ./secrets/mistral_key.txt
  groq_key:
    file: ./secrets/groq_key.txt
  cohere_key:
    file: ./secrets/cohere_key.txt

services:
  miragend:
    secrets:
      - anthropic_key
      - openai_key
      - deepseek_key
      - gemini_key
      - xai_key
      - mistral_key
      - groq_key
      - cohere_key
    environment:
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
      MISTRAL_API_KEY: ""
      GROQ_API_KEY: ""
      COHERE_API_KEY: ""
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_key
      GEMINI_API_KEY_FILE: /run/secrets/gemini_key
      XAI_API_KEY_FILE: /run/secrets/xai_key
      MISTRAL_API_KEY_FILE: /run/secrets/mistral_key
      GROQ_API_KEY_FILE: /run/secrets/groq_key
      COHERE_API_KEY_FILE: /run/secrets/cohere_key
